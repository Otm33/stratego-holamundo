<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stratego - despliegue de Tropas</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/board.css">
    <link rel="stylesheet" href="styles/setup.css">
</head>
<body>
    <div id="setup-header">
        <h1>⚔️ cuarto de guerra - despliegue Tactico</h1>
        <div id="status-info">
            <span id="team-display">equipo: <strong>RED</strong></span>
            <span id="opponent-status">esperando al oponente...</span>
        </div>
    </div>

    <div class="game-layout">
        <div id="board" class="board-container"></div>
        
        <div class="sidebar">
            <h3>Arsenal (10 piezas):</h3>
            <div id="inventory" class="inventory-grid"></div>
            
            <div class="setup-controls">
                <button id="randomize-btn" class="btn-action">🎲 Colocar Aleatorio</button>
                <button id="save-strategy-btn" class="btn-action">💾 Guardar Estrategia</button>
                <button id="load-strategy-btn" class="btn-action">📂 Cargar Estrategia</button>
                <button id="ready-btn" class="btn-ready" disabled>✅ LISTO PARA BATALLA</button>
            </div>

            <div class="info-box">
                <h4>📋 Instrucciones:</h4>
                <p>• Arrastra las piezas a las <strong>4 filas inferiores</strong></p>
                <p>• Coloca todas las 10 piezas</p>
                <p>• Presiona "LISTO" cuando termines</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/setup-main.js"></script>
</body>
</html>
